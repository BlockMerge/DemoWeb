name: Update Games List

on:
  push:
    paths:
      - 'builds/**'
  workflow_dispatch:

jobs:
  update-games-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Scan builds folder and generate games.json
        run: |
          #!/bin/bash
          echo "Scanning builds folder for games..."
          
          # Start JSON array
          echo "[" > games.json
          
          first=true
          
          # Loop through all directories in builds/
          for dir in builds/*/; do
            if [ -d "$dir" ]; then
              # Get the game name (folder name)
              game_name=$(basename "$dir")
              
              # Check if game/index.html exists
              if [ -f "${dir}game/index.html" ]; then
                echo "Found game: $game_name"
                
                # Add comma if not first item
                if [ "$first" = false ]; then
                  echo "," >> games.json
                fi
                first=false
                
                # Default values
                display_name=$(echo "$game_name" | sed 's/[-_]/ /g' | sed 's/\b\(.\)/\u\1/g')
                description="Play $display_name - An exciting Unity WebGL game!"
                thumbnail="icon-192.png"
                
                # Check for metadata.json
                if [ -f "${dir}metadata.json" ]; then
                  echo "Found metadata.json for $game_name"
                  # Simplistic extraction of values from JSON using grep/sed (to avoid dependency on jq)
                  m_name=$(grep -oP '"name":\s*"\K[^"]+' "${dir}metadata.json")
                  m_desc=$(grep -oP '"description":\s*"\K[^"]+' "${dir}metadata.json")
                  m_thumb=$(grep -oP '"thumbnail":\s*"\K[^"]+' "${dir}metadata.json")
                  
                  if [ ! -z "$m_name" ]; then display_name="$m_name"; fi
                  if [ ! -z "$m_desc" ]; then description="$m_desc"; fi
                  if [ ! -z "$m_thumb" ]; then thumbnail="$m_thumb"; fi
                fi
                
                # Add game entry to JSON
                echo "  {\"id\": \"$game_name\", \"name\": \"$display_name\", \"path\": \"builds/$game_name/game/index.html\", \"description\": \"$description\", \"loadingTitle\": \"Loading $display_name...\", \"thumbnail\": \"$thumbnail\"}" >> games.json
              fi
            fi
          done
          
          # Close JSON array
          echo "" >> games.json
          echo "]" >> games.json
          
          echo "Generated games.json:"
          cat games.json
      
      - name: Commit games.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add games.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update games.json [skip ci]"
            git push
          fi
