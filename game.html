<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Enhanced Viewport Settings for Mobile -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Primary Meta Tags -->
    <title id="game-title">Game - Unity WebGL</title>
    <meta name="title" content="Unity WebGL Game">
    <meta name="description" content="Play Unity WebGL games directly in your browser">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#6366f1">
    <meta name="msapplication-TileColor" content="#6366f1">
    <meta name="msapplication-navbutton-color" content="#6366f1">

    <!-- iOS Specific Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Android Specific -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Prevent text size adjustment on orientation change -->
    <meta name="format-detection" content="telephone=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="game-wrapper.css">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <button class="back-link"
                    onclick="console.log('Back button clicked!'); window.location.replace('./index.html');">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Back to Hub
                </button>
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <span class="logo-text" id="game-name">Game</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" id="fullscreen-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8 3H5C4.46957 3 3.96086 3.21071 3.58579 3.58579C3.21071 3.96086 3 4.46957 3 5V8M21 8V5C21 4.46957 20.7893 3.96086 20.4142 3.58579C20.0391 3.21071 19.5304 3 19 3H16M16 21H19C19.5304 21 20.0391 20.7893 20.4142 20.4142C20.7893 20.0391 21 19.5304 21 19V16M3 16V19C3 19.5304 3.21071 20.0391 3.58579 20.4142C3.96086 20.7893 4.46957 21 5 21H8"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Fullscreen
                </button>
            </div>
        </header>

        <!-- Game Container -->
        <main class="game-wrapper">
            <div class="game-container" id="game-container">
                <button class="exit-fullscreen-btn" id="exit-fullscreen-btn" aria-label="Exit Fullscreen">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <div class="loading-screen" id="loading-screen">
                    <div class="loading-content">
                        <div class="loading-spinner"></div>
                        <h2 class="loading-title" id="loading-title">Loading Game...</h2>
                        <div class="loading-bar">
                            <div class="loading-progress" id="loading-progress"></div>
                        </div>
                        <p class="loading-text" id="loading-text">Initializing game...</p>
                    </div>
                </div>
                <iframe id="game-frame" src="" frameborder="0" allowfullscreen webkitallowfullscreen playsinline
                    scrolling="no"></iframe>
            </div>
        </main>

        <!-- Instructions -->
        <section class="instructions" id="instructions">
            <div class="instruction-card">
                <div class="instruction-icon">🎮</div>
                <h3>How to Play</h3>
                <p id="instruction-text">Enjoy this Unity WebGL game!</p>
            </div>
            <div class="instruction-card">
                <div class="instruction-icon">⚡</div>
                <h3>Quick Start</h3>
                <p>Click fullscreen for the best experience. Game loads automatically.</p>
            </div>
            <div class="instruction-card">
                <div class="instruction-icon">🏆</div>
                <h3>Challenge</h3>
                <p>Beat your high score and have fun!</p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Game Hub. Built with Unity WebGL. | <a href="privacy.html" style="color: inherit; text-decoration: none; opacity: 0.8;">Privacy Policy</a></p>
        </footer>
    </div>

    <script src="game-wrapper.js"></script>
</body>

</html>
