<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Privacy Policy - BlockMerge</title>
    <meta name="description" content="Privacy Policy for BlockMerge and our Unity WebGL games.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark-800: #1e293b;
            --dark-700: #334155;
            --dark-600: #475569;
            --light: #f1f5f9;
            --white: #ffffff;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse at top, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(236, 72, 153, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom left, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 4rem 2rem;
            position: relative;
            z-index: 1;
        }

        .header {
            margin-bottom: 3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--white);
        }

        .back-link svg {
            width: 20px;
            height: 20px;
        }

        .content-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: var(--shadow-2xl);
        }

        /* Markdown Styles */
        #privacy-content {
            color: var(--light);
        }

        #privacy-content h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #privacy-content h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            color: var(--white);
        }

        #privacy-content p {
            margin-bottom: 1.25rem;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        #privacy-content ul {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        #privacy-content li {
            margin-bottom: 0.5rem;
        }

        #privacy-content strong {
            color: var(--white);
        }

        #privacy-content a {
            color: var(--primary-light);
            text-decoration: none;
        }

        #privacy-content a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--dark-600);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }

            .content-card {
                padding: 1.5rem;
            }

            #privacy-content h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Back to Hub
            </a>
        </header>

        <main class="content-card">
            <div id="privacy-content">
                <p>Loading privacy policy...</p>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2026 Game Hub. All rights reserved.</p>
        </footer>
    </div>

    <script>
        async function loadPrivacyPolicy() {
            try {
                const response = await fetch('privacy.md');
                if (!response.ok) throw new Error('Failed to load privacy policy');
                const markdown = await response.text();
                document.getElementById('privacy-content').innerHTML = marked.parse(markdown);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('privacy-content').innerHTML = '<p>Error loading privacy policy. Please try again later.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadPrivacyPolicy);
    </script>
</body>

</html>
